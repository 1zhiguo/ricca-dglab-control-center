name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-native.txt
      - name: Simulated unit tests (no game or physical device)
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'src'
          python -m unittest discover -s tests -p 'test_*.py'
      - run: python website/check_site.py
